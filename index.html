<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chapter 1 Comeback | Geometry Honors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F7; --grid:#DEE6EC; --card:#FFFFFF; --ink:#16324F; --ink-soft:#4A6178;
  --green:#1F7A4D; --green-soft:#E3F2EA; --amber:#9A6200; --amber-soft:#FFF4DC;
  --red:#A33A3A; --red-soft:#FBEAEA; --line:#C9D5DF; --focus:#2B6CB0;
  --display:"Bricolage Grotesque","Trebuchet MS",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1B27; --grid:#1A2A39; --card:#162536; --ink:#E6EEF5; --ink-soft:#A9BCCD;
    --green:#5CC28E; --green-soft:#16362A; --amber:#F0B44C; --amber-soft:#3A2D12;
    --red:#EE8A8A; --red-soft:#3D1D1D; --line:#2C4054; --focus:#8CB8F0;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font-family:var(--body);font-size:1.0625rem;line-height:1.55;color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;}
.wrap{max-width:780px;margin:0 auto;padding:28px 18px 64px}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0}
h1{font-size:clamp(2.1rem,6vw,3.2rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.55rem;font-weight:800}
h3{font-size:1.1rem;font-weight:600}
p{margin:.4em 0 .8em}
.lede{color:var(--ink-soft);max-width:60ch;font-size:1.1rem}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:22px 22px 20px;margin:18px 0}
.study{border-style:solid;border-width:2px;border-color:var(--ink)}
.yours{border:2px dashed var(--ink)}
.tag{display:inline-block;font-size:.85rem;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
label.f{display:block;font-weight:700;margin:14px 0 6px}
input[type=text],select{font:inherit;font-size:1.1rem;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;max-width:340px}
input[type=text]:focus,select:focus{border-color:var(--ink);outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.row>div{flex:1 1 200px}
.vers{display:flex;gap:10px;flex-wrap:wrap}
.vers label{cursor:pointer}
.vers input{position:absolute;opacity:0;pointer-events:none}
.vers span{display:inline-grid;place-items:center;width:56px;height:56px;border:2px solid var(--line);border-radius:12px;font-family:var(--display);font-weight:800;font-size:1.5rem;background:var(--card)}
.vers input:checked+span{background:var(--ink);color:var(--card);border-color:var(--ink)}
.vers input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:8px}
.qchip{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;font-size:.92rem;line-height:1.3;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer}
.qchip b{font-family:var(--display);font-size:1.2rem;min-width:1.6em}
.qchip[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--card)}
.btn{font:inherit;font-weight:700;font-size:1.05rem;border-radius:999px;padding:12px 22px;border:2px solid var(--ink);cursor:pointer;background:var(--ink);color:var(--card)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.linkish{background:none;border:none;color:var(--ink);text-decoration:underline;font:inherit;cursor:pointer;padding:4px}
.fig{background:#fff;border-radius:10px;padding:10px;display:flex;justify-content:center;margin:12px 0;border:1px solid var(--line)}
.fig img{max-width:100%;height:auto;max-height:300px}
.prompt{font-size:1.12rem}
ol.steps{margin:10px 0 0;padding-left:1.4em}
ol.steps li{margin:6px 0;padding-left:4px}
ol.steps li.new{animation:reveal .35s ease-out}
@keyframes reveal{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.choice{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer;background:var(--card)}
.choice input{margin-top:5px;accent-color:var(--ink);width:18px;height:18px}
.choice:has(input:checked){border-color:var(--ink)}
.fb{border-radius:12px;padding:14px 16px;margin-top:14px;font-weight:700}
.fb p{font-weight:400;margin:.3em 0 0}
.fb.ok{background:var(--green-soft);color:var(--green);border:2px solid var(--green)}
.fb.hint{background:var(--amber-soft);color:var(--amber);border:2px solid var(--amber)}
.fb.no{background:var(--red-soft);color:var(--red);border:2px solid var(--red)}
.fb .inkp{color:var(--ink)}
/* ruler progress: the signature element */
.ruler{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:8px 12px 6px;margin:0 0 6px}
.ruler-top{display:flex;justify-content:space-between;font-size:.88rem;color:var(--ink-soft);font-weight:700}
.ticks{display:flex;align-items:flex-end;height:44px;margin-top:4px;position:relative;
  background-image:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 10px);background-size:100% 9px;background-repeat:no-repeat;background-position:bottom}
.tick{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative}
.tick i{display:block;width:2px;height:20px;background:var(--ink)}
.tick span{font-family:var(--display);font-weight:800;font-size:.95rem;line-height:1;margin-bottom:3px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.tick.first span,.tick.hint span,.tick.retry span{background:var(--green);color:#fff}
.tick.hint span,.tick.retry span{background:var(--green-soft);color:var(--green);box-shadow:inset 0 0 0 2px var(--green)}
.tick.notyet span{background:var(--red-soft);color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.tick.now span{background:var(--ink);color:var(--card)}
.skillhead{margin:18px 0 0}
.skillhead .tag{margin:0}
table.rep{width:100%;border-collapse:collapse;margin-top:10px;font-size:.98rem}
table.rep th,table.rep td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.pill{display:inline-block;font-weight:700;font-size:.85rem;padding:2px 10px;border-radius:999px}
.pill.first{background:var(--green);color:#fff}.pill.hint,.pill.retry{background:var(--green-soft);color:var(--green)}.pill.notyet{background:var(--red-soft);color:var(--red)}
.score{font-family:var(--display);font-weight:800;font-size:4.2rem;line-height:1}
.code{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:.06em;border:2px dashed var(--ink);border-radius:10px;padding:6px 14px;display:inline-block}
.muted{color:var(--ink-soft);font-size:.95rem}
.err{color:var(--red);font-weight:700;margin-top:10px}
@media (max-width:520px){.tick span{width:19px;height:19px;font-size:.72rem}.ruler{padding:6px 6px 4px}.card{padding:18px 14px}}
@media (prefers-reduced-motion: reduce){ol.steps li.new{animation:none}}
@media print{body{background:#fff}.ruler,.btns{display:none}.card{break-inside:avoid}}
</style>
</head>

const KEY = "ch1-comeback-v1";
const STATUS = { first: "Proved it", hint: "Proved it with a hint", retry: "Proved it on a new problem", notyet: "Not yet: see your teacher" };
let S = load() || fresh();

function fresh(){ return { stage:"setup", name:"", period:"", version:"", picked:[], queue:[], idx:0, phase:"learn", step:1, attempts:0, order:{}, results:{}, t0:null, sent:false, code:"" }; }
function load(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const $ = (sel, el=document) => el.querySelector(sel);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function render(){
  const app = $("#app");
  if(S.stage === "setup") app.innerHTML = setupView();
  else if(S.stage === "work"){
    if(S.results[S.queue[S.idx]]){ S.idx++; S.phase = "learn"; S.step = 1; S.attempts = 0;
      if(S.idx >= S.queue.length){ S.stage = "report"; S.code = makeCode(); return render(); } }
    app.innerHTML = rulerView() + workView();
  }
  else app.innerHTML = reportView();
  bind(); save();
}

/* ---------- setup ---------- */
function setupView(){
  const chips = Object.keys(DATA.skills).map(q => {
    const on = S.picked.includes(+q);
    return `<button type="button" class="qchip" data-q="${q}" aria-pressed="${on}"><b>${q}</b><span>${esc(DATA.skills[q].title)}</span></button>`;
  }).join("");
  return `
  <header>
    <p class="tag">Geometry Honors, Chapter 1 Test corrections</p>
    <h1>Chapter 1 Comeback</h1>
    <p class="lede">For every question you missed, study a worked example, then solve a brand-new version on your own. No one else's answers will match yours.</p>
  </header>
  <section class="card study">
    <h2>About you</h2>
    <div class="row">
      <div><label class="f" for="nm">First and last name</label><input type="text" id="nm" autocomplete="name" value="${esc(S.name)}"></div>
      <div><label class="f" for="pd">Class period</label><input type="text" id="pd" inputmode="numeric" value="${esc(S.period)}" style="max-width:140px"></div>
    </div>
    <p class="f" style="font-weight:700;margin-top:16px">Which version of the test did you take?</p>
    <div class="vers" role="radiogroup" aria-label="Test version">
      ${["A","B","C","D"].map(v=>`<label><input type="radio" name="ver" value="${v}" ${S.version===v?"checked":""}><span>${v}</span></label>`).join("")}
    </div>
  </section>
  <section class="card study">
    <h2>Which questions did you miss?</h2>
    <p class="muted">Tap each question number you got wrong on your graded test. The numbers are the same on every version.</p>
    <div class="qgrid">${chips}</div>
    <div class="btns"><button class="linkish" id="allq" type="button">Select all 16</button><button class="linkish" id="noq" type="button">Clear</button></div>
  </section>
  <section class="card">
    <h3>How it works</h3>
    <ol class="steps">
      <li>Study the worked example, one step at a time.</li>
      <li>Solve a new version of the question. If you miss it, you get a hint and a second try.</li>
      <li>Still stuck? You'll see the full solution, then prove it on one more new problem.</li>
    </ol>
    <p><b>${esc(CONFIG.EARN_BACK)}</b></p>
    <div id="setupErr" class="err" role="alert"></div>
    <div class="btns"><button class="btn" id="go" type="button">Start my corrections</button></div>
  </section>`;
}

/* ---------- work ---------- */
function rulerView(){
  const done = Object.keys(S.results).length;
  const ticks = S.queue.map((q,i) => {
    const r = S.results[q]; const cls = r ? r.status : (i === S.idx ? "now" : "");
    return `<div class="tick ${cls}" title="Question ${q}: ${r ? STATUS[r.status] : (i===S.idx ? "working now" : "not started")}"><span>${q}</span><i></i></div>`;
  }).join("");
  return `<nav class="ruler" aria-label="Progress"><div class="ruler-top"><span>${esc(S.name)}</span><span>${done} of ${S.queue.length} finished</span></div><div class="ticks">${ticks}</div></nav>`;
}
function itemFor(q, slot){ return DATA.items[q][S.order[q][slot]]; }
function figHTML(it){ return it.fig ? `<div class="fig"><img src="${it.fig}" alt="Diagram for this problem"></div>` : ""; }
function stepsHTML(it, n, animateLast){
  return `<ol class="steps">${it.steps.slice(0,n).map((s,i)=>`<li class="${animateLast && i===n-1 ? "new":""}">${esc(s)}</li>`).join("")}</ol>`;
}
function fieldsHTML(it){
  return it.fields.map((f,i) => {
    if(f.kind === "num") return `<label class="f" for="f${i}">${esc(f.label)}${f.unit ? ` <span class="muted">(${esc(f.unit)})</span>`:""}</label><input type="text" id="f${i}" inputmode="decimal" autocomplete="off" style="max-width:220px">`;
    if(f.kind === "select") return `<label class="f" for="f${i}">${esc(f.label)}</label><select id="f${i}"><option value="">Choose one</option>${f.options.map(o=>`<option>${esc(o)}</option>`).join("")}</select>`;
    return `<fieldset style="border:none;padding:0;margin:10px 0 0"><legend class="sr" style="position:absolute;left:-9999px">Choose one answer</legend>${f.options.map((o,j)=>`<label class="choice"><input type="radio" name="f${i}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}</fieldset>`;
  }).join("");
}
function workView(){
  const q = S.queue[S.idx], sk = DATA.skills[q];
  const head = `<div class="skillhead"><p class="tag">Question ${q}, Lesson ${sk.lesson}</p><h2>${esc(sk.title)}</h2></div>`;
  if(S.phase === "learn"){
    const ex = itemFor(q, 0), total = ex.steps.length, more = S.step < total;
    return head + `<section class="card study"><h3>Study this example</h3><p class="prompt">${esc(ex.prompt)}</p>${figHTML(ex)}
      ${stepsHTML(ex, S.step, true)}
      <div class="btns">${more ? `<button class="btn ghost" id="nextStep" type="button">Show next step (${S.step} of ${total})</button>` : ""}
      <button class="btn" id="toTry" type="button" ${more ? "disabled" : ""}>I'm ready to try one</button></div></section>`;
  }
  const slot = S.phase === "retry" ? 2 : 1, it = itemFor(q, slot);
  const title = S.phase === "retry" ? "One more new problem" : "Your turn";
  const note = S.phase === "retry" ? `<p class="muted">You studied the full solution. Now prove it on a different problem.</p>` : "";
  return head + `<section class="card yours"><h3>${title}</h3>${note}<p class="prompt">${esc(it.prompt)}</p>${figHTML(it)}
    <div id="fields">${fieldsHTML(it)}</div>
    <div id="fb"></div>
    <div class="btns" id="actions"><button class="btn" id="check" type="button">Check my answer</button></div></section>`;
}
function parseNum(s){
  s = String(s).trim().replace(/[\u2212\u2013\u2014]/g,"-").replace(/[°\s,]/g,"").replace(/units?|squareunits|sq\.?/gi,"");
  if(!s) return NaN;
  if(/^-?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(s)){ const [a,b] = s.split("/").map(Number); return a/b; }
  if(!/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
  return parseFloat(s);
}
function readAnswers(it){
  const out = []; let blank = false, bad = false;
  it.fields.forEach((f,i) => {
    if(f.kind === "num"){ const raw = $("#f"+i).value; const n = parseNum(raw); if(!raw.trim()) blank = true; else if(isNaN(n)) bad = true; out.push(Math.abs(n - f.value) <= f.tol + 1e-9); }
    else if(f.kind === "select"){ const val = $("#f"+i).value; if(!val) blank = true; out.push(val === f.value); }
    else { const c = document.querySelector(`input[name=f${i}]:checked`); if(!c) blank = true; out.push(!!c && c.value === f.value); }
  });
  return { blank, bad, ok: out.every(Boolean) };
}
function finish(status){ const q = S.queue[S.idx]; S.results[q] = { status, versions: S.order[q].join("") }; }
function nextQuestion(){
  S.idx++; S.phase = "learn"; S.step = 1; S.attempts = 0;
  if(S.idx >= S.queue.length){ S.stage = "report"; S.code = makeCode(); }
  render(); window.scrollTo({top:0});
}
function onCheck(){
  const q = S.queue[S.idx], slot = S.phase === "retry" ? 2 : 1, it = itemFor(q, slot);
  const r = readAnswers(it), fb = $("#fb"), act = $("#actions");
  if(r.blank){ fb.innerHTML = `<div class="fb no">Fill in every answer box before checking.</div>`; return; }
  if(r.bad){ fb.innerHTML = `<div class="fb no">Type numbers only, like 49 or -2.5.</div>`; return; }
  const nextBtn = `<button class="btn green" id="nxt" type="button">${S.idx === S.queue.length-1 ? "See my results" : "Next question"}</button>`;
  if(r.ok){
    const status = S.phase === "retry" ? "retry" : (S.attempts === 0 ? "first" : "hint");
    finish(status); save();
    fb.innerHTML = `<div class="fb ok">Correct. ${status === "first" ? "You proved this skill on your first try." : "You worked through it and proved the skill."}</div>`;
    act.innerHTML = nextBtn; $("#nxt").onclick = nextQuestion; lockInputs(); refreshRuler(); return;
  }
  S.attempts++; save();
  if(S.attempts === 1){
    fb.innerHTML = `<div class="fb hint">Not quite. Here's a hint:<p class="inkp">${esc(it.hint)}</p></div>`;
    act.innerHTML = `<button class="btn" id="check" type="button">Check my answer again</button>`; $("#check").onclick = onCheck; return;
  }
  lockInputs();
  if(S.phase === "try"){
    fb.innerHTML = `<div class="fb no">Let's look at how this one is solved.<div class="inkp" style="font-weight:400">${stepsHTML(it, it.steps.length, false)}</div></div>`;
    act.innerHTML = `<button class="btn" id="more" type="button">Try one more new problem</button>`;
    $("#more").onclick = () => { S.phase = "retry"; S.attempts = 0; render(); window.scrollTo({top:0}); };
  } else {
    finish("notyet"); save();
    fb.innerHTML = `<div class="fb no">This skill needs more practice. Study this solution, and ask your teacher about it.<div class="inkp" style="font-weight:400">${stepsHTML(it, it.steps.length, false)}</div></div>`;
    act.innerHTML = nextBtn; $("#nxt").onclick = nextQuestion; refreshRuler();
  }
}
function lockInputs(){ document.querySelectorAll("#fields input, #fields select").forEach(e => e.disabled = true); }
function refreshRuler(){ const r = document.querySelector(".ruler"); if(r){ const t = document.createElement("div"); t.innerHTML = rulerView(); r.replaceWith(t.firstChild); } }

/* ---------- report ---------- */
function scoreOf(){ const n = S.queue.length, P = CONFIG.POINTS; const pts = S.queue.reduce((a,q) => a + P[S.results[q].status], 0); return Math.round(100 * pts / (P.first * n)); }
function makeCode(){ const str = `${S.name}|${S.period}|${S.version}|${S.queue.join(",")}|${scoreOf()}`; let h = 7; for(const c of str) h = (h * 31 + c.charCodeAt(0)) % 1679616; return "C1-" + h.toString(36).toUpperCase().padStart(4,"0"); }
function reportView(){
  const sc = scoreOf(), pass = sc >= CONFIG.PASS_PERCENT, mins = Math.max(1, Math.round((Date.now() - S.t0) / 60000));
  const rows = S.queue.map(q => { const r = S.results[q]; return `<tr><td><b>${q}</b></td><td>${esc(DATA.skills[q].title)}</td><td><span class="pill ${r.status}">${STATUS[r.status]}</span></td></tr>`; }).join("");
  const notyet = S.queue.filter(q => S.results[q].status === "notyet");
  return `
  <header><p class="tag">Chapter 1 Comeback results</p><h1>${esc(S.name)}</h1><p class="lede">Period ${esc(S.period)}, took Version ${S.version}, ${S.queue.length} question${S.queue.length>1?"s":""} corrected in about ${mins} min.</p></header>
  <section class="card study">
    <div class="row" style="align-items:center">
      <div><div class="score">${sc}%</div><p class="muted">Mastery score</p></div>
      <div><p><b>${pass ? "You reached the mastery goal." : `The goal is ${CONFIG.PASS_PERCENT}%.`}</b></p><p class="muted">${pass ? esc(CONFIG.EARN_BACK) : "Talk with your teacher about the skills marked \"Not yet.\""}</p></div>
    </div>
    <table class="rep"><thead><tr><th>#</th><th>Skill</th><th>Result</th></tr></thead><tbody>${rows}</tbody></table>
    ${notyet.length ? `<p class="muted" style="margin-top:12px">Skills to review: ${notyet.map(q => "Q" + q).join(", ")}.</p>` : ""}
  </section>
  <section class="card">
    <h3>Turn it in</h3>
    <p id="sendMsg">${CONFIG.SHEET_URL ? (S.sent ? "Your results were sent to your teacher." : "Sending your results to your teacher...") : "Take a screenshot of this page and submit it in Google Classroom."}</p>
    <p>Your completion code: <span class="code">${S.code}</span></p>
    <p class="muted">Write this code at the top of your test corrections or in the Google Classroom assignment comment.</p>
    <div class="btns"><button class="btn ghost" id="print" type="button">Print this page</button><button class="linkish" id="reset" type="button">Start over (erases this work)</button></div>
  </section>`;
}
function sendResults(){
  if(!CONFIG.SHEET_URL || S.sent) return;
  const body = new URLSearchParams({ timestamp: new Date().toLocaleString(), name: S.name, period: S.period, version: S.version,
    questions: S.queue.join(","), results: S.queue.map(q => `Q${q}:${S.results[q].status}`).join(" | "),
    notyet: S.queue.filter(q => S.results[q].status === "notyet").join(","), score: scoreOf(),
    minutes: Math.max(1, Math.round((Date.now() - S.t0) / 60000)), code: S.code });
  fetch(CONFIG.SHEET_URL, { method: "POST", mode: "no-cors", body })
    .then(() => { S.sent = true; save(); const m = $("#sendMsg"); if(m) m.textContent = "Your results were sent to your teacher."; })
    .catch(() => { const m = $("#sendMsg"); if(m) m.textContent = "Your results could not be sent. Take a screenshot of this page and submit it in Google Classroom."; });
}

/* ---------- events ---------- */
function bind(){
  if(S.stage === "setup"){
    document.querySelectorAll(".qchip").forEach(b => b.onclick = () => {
      const q = +b.dataset.q; S.picked = S.picked.includes(q) ? S.picked.filter(x => x !== q) : [...S.picked, q];
      b.setAttribute("aria-pressed", S.picked.includes(q)); save(); });
    $("#allq").onclick = () => { S.picked = Object.keys(DATA.skills).map(Number); saveInputs(); render(); };
    $("#noq").onclick = () => { S.picked = []; saveInputs(); render(); };
    $("#nm").oninput = saveInputs; $("#pd").oninput = saveInputs;
    document.querySelectorAll("input[name=ver]").forEach(r => r.onchange = saveInputs);
    $("#go").onclick = () => {
      saveInputs(); const e = $("#setupErr");
      if(S.name.trim().split(/\s+/).length < 2) return e.textContent = "Type your first and last name.";
      if(!S.period.trim()) return e.textContent = "Type your class period.";
      if(!S.version) return e.textContent = "Choose the test version you took (A, B, C, or D).";
      if(!S.picked.length) return e.textContent = "Tap at least one question you missed.";
      S.queue = S.picked.slice().sort((a,b) => a - b);
      const others = ["A","B","C","D"].filter(v => v !== S.version);
      S.queue.forEach(q => S.order[q] = shuffle(others));
      S.stage = "work"; S.idx = 0; S.phase = "learn"; S.step = 1; S.t0 = Date.now(); render(); window.scrollTo({top:0});
    };
  } else if(S.stage === "work"){
    const ns = $("#nextStep"); if(ns) ns.onclick = () => { S.step++; render(); };
    const tt = $("#toTry"); if(tt) tt.onclick = () => { S.phase = "try"; S.attempts = 0; render(); window.scrollTo({top:0}); };
    const ck = $("#check"); if(ck) ck.onclick = onCheck;
    document.querySelectorAll("#fields input[type=text]").forEach(inp => inp.addEventListener("keydown", e => { if(e.key === "Enter"){ const b = $("#check"); if(b) b.click(); } }));
  } else {
    $("#print").onclick = () => window.print();
    $("#reset").onclick = () => { if(confirm("Start over? This erases your corrections on this device.")){ S = fresh(); render(); } };
    sendResults();
  }
}
function saveInputs(){
  const nm = $("#nm"), pd = $("#pd"), v = document.querySelector("input[name=ver]:checked");
  if(nm) S.name = nm.value; if(pd) S.period = pd.value; if(v) S.version = v.value; save();
}
render();
</script>
</body>
</html>
